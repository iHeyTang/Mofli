<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mofli · 猫头设定稿</title>
    <link rel="stylesheet" href="./design.css" />
  </head>
  <body>
    <header>
      <a href="/">mofli ✳</a><span>角色设定 / CAT STUDIES · 01</span
      ><a href="/">返回动画工作台 ↗</a>
    </header>
    <main>
      <div class="intro">
        <div>
          <p class="eyebrow">先确定角色，再让它动起来</p>
          <h1>猫头，三种轮廓。</h1>
          <p>
            同一套黑白语言，比较耳朵、脸型与侧面关系。<br />这是静态设定稿，尚未接入骨架或替换当前角色。
          </p>
        </div>
        <div class="tools">
          <label><input type="checkbox" id="outline" /> 只看轮廓曲线</label>
          <p id="choice" aria-live="polite">尚未选择造型</p>
        </div>
      </div>
      <div class="column-labels">
        <span>造型方向</span><span>正面</span><span>四分之三侧面</span
        ><span>侧面</span>
      </div>
      <section id="studies" aria-label="猫头造型对比"></section>
      <footer>
        每个视角都有独立 SVG 母版。选择造型后，再细化耳根、转头姿态和动画控制。
      </footer>
    </main>
    <script type="module" src="./design.js"></script>
  </body>
</html>
